name: Publish .deb to apt repo

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.deb'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Zielkanal (stable oder testing)'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - stable

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cast-apt-repo (always HEAD of main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install reprepro + gpg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y reprepro gnupg

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=testing" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild reprepro DB from pool/ (idempotent)
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          shopt -s nullglob globstar
          # reprepro-DB wird per .gitignore nicht persistiert → bei jedem Run
          # leer. Darum: alle existierenden pool-.debs neu einlesen, damit
          # dists/$CHANNEL/Packages nicht nur die incoming-Pakete kennt.
          # reprepro schreibt nur die HÖCHSTE Version pro Paket in Packages,
          # alte Versionen bleiben physisch im pool/ für Downgrades.
          for deb in pool/main/**/*.deb; do
            echo "=== rescan: $deb ==="
            reprepro --ignore=wrongdistribution --ignore=missingfield \
              includedeb "$CHANNEL" "$deb" || echo "  (already current)"
          done

      - name: Ingest new .deb files from incoming/
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          shopt -s nullglob
          found=0
          for deb in incoming/*.deb; do
            found=1
            echo "=== $CHANNEL ← $deb ==="
            reprepro --ignore=wrongdistribution includedeb "$CHANNEL" "$deb"
          done
          if [ $found -eq 0 ]; then
            echo "Keine neuen .debs in incoming/ — nur Rescan."
          fi

      - name: Move ingested .debs out of incoming
        run: |
          mkdir -p archive
          shopt -s nullglob
          for deb in incoming/*.deb; do
            mv "$deb" "archive/$(basename "$deb")"
          done

      - name: Commit updated repo
        run: |
          git config user.name "cast-apt-bot"
          git config user.email "noreply@cast-system.at"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "apt: publish $(ls archive/ | tail -5 | tr '\n' ' ') to ${{ steps.channel.outputs.name }}"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push ok on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) — rebase on origin/main and retry"
            git pull --rebase origin main
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Build Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
