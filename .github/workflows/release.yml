name: Publish .deb to apt repo

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.deb'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Zielkanal (stable oder testing)'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - stable

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cast-apt-repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install reprepro + gpg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y reprepro gnupg

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=testing" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest .deb files
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          shopt -s nullglob
          found=0
          for deb in incoming/*.deb; do
            found=1
            echo "=== $CHANNEL ← $deb ==="
            reprepro --ignore=wrongdistribution includedeb "$CHANNEL" "$deb"
          done
          if [ $found -eq 0 ]; then
            echo "Keine .debs in incoming/ — nichts zu tun."
            exit 0
          fi

      - name: Move ingested .debs out of incoming
        run: |
          mkdir -p archive
          shopt -s nullglob
          for deb in incoming/*.deb; do
            mv "$deb" "archive/$(basename "$deb")"
          done

      - name: Commit updated repo
        run: |
          git config user.name "cast-apt-bot"
          git config user.email "noreply@cast-system.at"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "apt: publish $(ls archive/ | tail -5 | tr '\n' ' ') to ${{ steps.channel.outputs.name }}"
          git push

      - name: Build Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
